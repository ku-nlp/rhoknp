name: Generate lock files

on:
  push:
    paths:
      - "pyproject.toml"
      - "uv.lock"

jobs:
  generate-lock-files:
    name: Generate lock files from pyproject.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - name: Export pylock.toml
        run: uv export -o pylock.toml
      - name: Export requirements.txt
        run: uv export --only-group docs --no-annotate --no-hashes -o docs/requirements.txt
      - name: Commit and push changes
        if: ${{ github.actor != 'dependabot[bot]' }}
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: update lock files
          file_pattern: pylock.toml docs/requirements.txt
          disable_globbing: true
